<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Поиск и фильтрация — Practice 05</title>
    <style>
      :root { --fg:#111; --muted:#666; --bg:#fafafa; --accent:#0a7; --err:#c22; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--fg); background:var(--bg); }
      .container { max-width: 900px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      form.controls { display: grid; grid-template-columns: 1fr 180px 120px 120px; gap: 8px; align-items: start; }
      input[type="text"], select { padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
      button { padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; }
      button.primary { background: var(--accent); color: white; border-color: var(--accent); }
      .error { color: var(--err); font-size: 12px; margin-top: -4px; }
      .banner { padding: 10px 12px; border-radius: 8px; background: #fee; color: var(--err); border: 1px solid #f99; margin-bottom: 12px; display:none; }
      .list { margin-top: 16px; display: grid; gap: 8px; }
      .card { padding: 12px; border-radius: 8px; border: 1px solid #eee; background: white; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .muted { color: var(--muted); font-size: 12px; }
      .badge { font-size: 12px; padding: 2px 6px; border-radius: 999px; border: 1px solid #ddd; background: #f7f7f7; }
      .pagination { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
      .empty { text-align: center; padding: 24px; border: 1px dashed #ddd; border-radius: 8px; background: #fff; }
      .loading { opacity: 0.6; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Поиск и фильтрация</h1>

      <div id="apiError" class="banner"></div>

      <form id="controls" class="controls">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <input id="query" type="text" placeholder="Поиск по ключевому слову" />
          <div id="queryError" class="error" style="display:none;"></div>
        </div>

        <select id="status">
          <option value="">Все</option>
          <option value="active">Активен</option>
          <option value="archived">В архиве</option>
          <option value="draft">Черновик</option>
        </select>

        <div class="row">
          <button type="button" id="prev">Назад</button>
          <button type="button" id="next">Вперед</button>
        </div>

        <div class="row">
          <button type="button" id="reset">Сброс</button>
          <button type="button" id="export">Скачать JSON</button>
        </div>
      </form>

      <div class="muted" id="pageInfo" style="margin-top:8px;">Страница 1 из 1</div>

      <div id="loading" class="muted" style="margin-top:8px; display:none;">Загрузка…</div>

      <div id="list" class="list"></div>

      <div id="empty" class="empty" style="display:none;">
        <div>Ничего не найдено</div>
        <div style="margin-top:8px;"><button id="emptyReset">Сбросить фильтры</button></div>
      </div>
    </div>

    <script>
      // Client-side logic per spec_ui_after.md and contract.md
      const $ = (id) => document.getElementById(id);
      const state = { page: 1, limit: 20, query: '', status: '' };

      const QUERY_ALLOWED_RE = /^[\p{L}\p{Nd} ]+$/u; // same as server rule

      function setLoading(loading) {
        $('loading').style.display = loading ? 'block' : 'none';
        document.body.classList.toggle('loading', loading);
      }

      function renderList(data) {
        const list = $('list');
        list.innerHTML = '';
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          const date = new Date(item.createdAt);
          card.innerHTML = `
            <div class="row">
              <div><strong>${escapeHtml(item.title)}</strong></div>
              <span class="badge">${item.status}</span>
            </div>
            <div class="muted">${date.toLocaleString()}</div>
            ${item.description ? `<div>${escapeHtml(item.description)}</div>` : ''}
          `;
          list.appendChild(card);
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function validateQueryInline(value) {
        const err = $('queryError');
        err.style.display = 'none';
        err.textContent = '';
        const trimmed = value.trim();
        if (trimmed.length === 0) return true; // optional
        if (trimmed.length < 2) {
          err.textContent = 'Строка поиска должна содержать от 2 символов';
          err.style.display = 'block';
          return false;
        }
        if (trimmed.length > 200) {
          err.textContent = 'Строка поиска не должна превышать 200 символов';
          err.style.display = 'block';
          return false;
        }
        if (!QUERY_ALLOWED_RE.test(trimmed)) {
          err.textContent = 'Допустимы только буквы, цифры и пробелы';
          err.style.display = 'block';
          return false;
        }
        return true;
      }

      async function fetchItems() {
        setLoading(true);
        $('apiError').style.display = 'none';
        $('empty').style.display = 'none';
        try {
          const params = new URLSearchParams();
          if (state.query.trim().length >= 2) params.set('query', state.query.trim());
          if (state.status) params.set('status', state.status);
          params.set('page', String(state.page));
          params.set('limit', String(state.limit));
          const res = await fetch(`/api/items?${params.toString()}`);
          const text = await res.text();
          let json;
          try { json = JSON.parse(text); } catch { json = null; }
          if (!res.ok) {
            const msg = json && json.message ? json.message : 'Ошибка запроса';
            $('apiError').textContent = `Ошибка: ${msg}`;
            $('apiError').style.display = 'block';
            $('list').innerHTML = '';
            $('pageInfo').textContent = '';
            return;
          }
          const { data, meta } = json;
          $('pageInfo').textContent = `Страница ${meta.page} из ${Math.max(1, meta.totalPages)}`;
          renderList(data);
          if (data.length === 0) {
            $('empty').style.display = 'block';
          }
        } catch (e) {
          $('apiError').textContent = 'Ошибка сети';
          $('apiError').style.display = 'block';
        } finally {
          setLoading(false);
        }
      }

      function resetFilters() {
        state.page = 1;
        state.query = '';
        state.status = '';
        $('query').value = '';
        $('status').value = '';
        $('queryError').style.display = 'none';
        fetchItems();
      }

      $('query').addEventListener('input', (e) => {
        const value = e.target.value;
        validateQueryInline(value);
      });

      $('query').addEventListener('change', (e) => {
        const value = e.target.value;
        if (!validateQueryInline(value)) return;
        state.page = 1; // reset pagination on filter change
        state.query = value;
        fetchItems();
      });

      // Clear-on-Escape behavior: when focused on the query input, pressing Esc clears value and resets filters
      $('query').addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Esc') {
          const inp = e.target;
          const val = typeof inp.value === 'string' ? inp.value : '';
          if (val.trim().length > 0) {
            e.preventDefault();
            // Ensure we clear the visible input and run existing reset logic
            inp.value = '';
            resetFilters();
          }
        }
      });

      $('status').addEventListener('change', (e) => {
        state.page = 1; // reset pagination on filter change
        state.status = e.target.value;
        fetchItems();
      });

      $('prev').addEventListener('click', () => {
        if (state.page > 1) {
          state.page -= 1;
          fetchItems();
        }
      });
      $('next').addEventListener('click', () => {
        // optimistic next; the page indicator uses server meta; user can navigate even if beyond results -> shows empty state
        state.page += 1;
        fetchItems();
      });

       $('reset').addEventListener('click', resetFilters);
       $('emptyReset').addEventListener('click', resetFilters);

       // Export JSON: fetch /api/export with current filters and download as export.json
       $('export').addEventListener('click', async () => {
         const btn = $('export');
         btn.disabled = true;
         try {
           // Build query params using current filters (query/status)
           const params = new URLSearchParams();
           const q = state.query.trim();
           if (q.length >= 2) params.set('query', q);
           if (state.status) params.set('status', state.status);

           // Hide previous error banner
           $('apiError').style.display = 'none';
           $('apiError').textContent = '';

           const res = await fetch(`/api/export?${params.toString()}`);

           if (res.status === 400) {
             let msg = 'Некорректные параметры запроса';
             try {
               const body = await res.json();
               if (body && body.message) msg = body.message;
             } catch {}
             $('apiError').textContent = `Ошибка: ${msg}`;
             $('apiError').style.display = 'block';
             return;
           }

           if (!res.ok) {
             $('apiError').textContent = 'Ошибка экспорта';
             $('apiError').style.display = 'block';
             return;
           }

           const text = await res.text();
           const blob = new Blob([text], { type: 'application/json' });
           const url = URL.createObjectURL(blob);
           const a = document.createElement('a');
           a.href = url;
           a.download = 'export.json';
           document.body.appendChild(a);
           a.click();
           URL.revokeObjectURL(url);
           a.remove();
         } catch (e) {
           $('apiError').textContent = 'Ошибка сети';
           $('apiError').style.display = 'block';
         } finally {
           btn.disabled = false;
         }
       });

       // Initial fetch
       fetchItems();
      </script>
  </body>
  </html>
